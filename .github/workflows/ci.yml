name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # devDependencies only (linkedom for component tests, esbuild for dist), pinned in package-lock.json.
      - run: npm ci
      - name: lint:ui (no green, no opacity dimming, no literal 44px)
        run: npm run lint
      - run: npm test
      - name: Generated files are committed
        run: git diff --exit-code
